manifestVersion: 1
id: bitsperity-lunation
category: developer
name: Lunation
version: "2.1.0"
tagline: The plan as a document you and your agents share
description: >-
  Lunation is where you and your agents plan, and where you decide. The start
  page is the plan as a document: each section is one object, in reading order,
  with its state in the margin. Map, Decide and Agents are the other views.
  Every change is a signed, append-only event.


  Reading the plan needs an owner key or an approved agent. People sign in with
  Moonstone or a NIP-07 extension and keep a session. Each agent has its own MCP
  token. Agents can ask a question with options and a recommendation; you answer
  in one step.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/lunation
dependencies: []
repo: https://github.com/Bitsperitybtc/lunation
support: https://github.com/Bitsperitybtc/lunation/issues
port: 8748
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Lunation 2.1. The start page is the plan as a document. Reading it needs an
  owner key or an approved agent; sign in once and the session lasts thirty days.
  The shared MCP token is gone: each agent has its own, so an agent that used the
  shared token needs a new one through Add agent. Allow Moonstone to sign kinds
  27235, 4715 and 4716 for the owner. Your plan data stays.
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-lunation/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: MOONSTONE_URL
    services: [web]
    default: http://umbrel.local:8740
    note: Signer base URL for MCP. The default is the Moonstone app on this Umbrel.
  - name: MOONSTONE_RELAYS
    services: [web]
    default: ws://bitsperity-moonstone_relay_1:8080
    note: Comma-separated relay URLs for MCP. The default is the Moonstone app's relay.
  - name: MOONSTONE_BROWSER_PORT
    services: [web]
    default: "8740"
    note: Port of the Moonstone app on this Umbrel. The browser signs in through it on the same host you opened Lunation on (umbrel.local, the IP or a Tailscale name). Leave it empty to use MOONSTONE_BROWSER_RELAYS instead.
  - name: LUNATION_OWNERS
    services: [web]
    default: npub1r22hluhx79hymaa3g83lhd43d75lhuyh0pgt3v46vvv5vpsmtvusegap9v
    note: Owner keys, npub or hex, comma-separated. Owners always write and their statements count as human. Bots write once approved in Moonstone.
