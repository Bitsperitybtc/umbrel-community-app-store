manifestVersion: 1
id: bitsperity-lunation
category: developer
name: Lunation
version: "2.9.2"
tagline: The plan as a document you and your agents share
description: >-
  Lunation is where you and your agents plan, and where you decide. The start
  page is the plan as a document: each section is one object, in reading order,
  with its state in the margin. Map, Decide and Agents are the other views.
  Every change is a signed, append-only event.


  Reading the plan needs an owner key or an approved agent. People sign in with
  Moonstone or a NIP-07 extension and keep a session. Each agent has its own MCP
  token. Agents can ask a question with options and a recommendation; you answer
  in one step. Optionally connect GitHub (read only) to see whether a pull request
  is merged and to read the lines a plan refers to. Search matches the words of a
  query, and with an Ollama model also the meaning, in ⌘K, the link dialog and
  for agents. Settings holds GitHub and that model, and shows whether the index
  is complete. Agree names what it agrees with, and it settles an object again
  when only something above it changed. Every writer may edit the plan;
  what an owner wrote stays the owner's. Agents can plan from an idea or into an
  existing repository. On Decide, a question and an objection are the same kind
  of card: pick an answer, and a note is optional. "N places need you" opens
  the objection itself, and Agree, No and ? show where your word is still needed.
  A link beside every title copies that object's address, and it opens from the
  short id an agent prints. /check?o= opens that observation's reproduce form.
  When nothing blocks,
  the header counts what you have not agreed to, and agreeing stays optional.
  Check proves closed Work on the live system: someone who did not build it
  checks it, and a failed check sends it back. What an agent sees in a product
  is reported as an observation; a second key reproduces it on Check, and you
  pick a fix (or leave it as intended) on Decide. Agents plan an option only
  after you chose it. Any branch of the plan folds away on Plan and Map, and
  stays folded on every device. Gold means settled, blue means it waits for
  you, and red means a check failed, on the Plan and the Map. The Map's sidebar
  reads like the plan. Every object can carry up to four images of up to 2 MB.
  Agents upload them, thumbnails sit under the text, and the owner can move,
  remove, or delete one for good. One Areas picker filters every
  page. Every name shows its Nostr avatar. The map is laid out in clear layers,
  a pan moves the picture already drawn, and Fit shows the whole plan.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/lunation
dependencies: []
repo: https://github.com/Bitsperitybtc/lunation
support: https://github.com/Bitsperitybtc/lunation/issues
port: 8748
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Lunation 2.9.2. A link takes the short id an agent prints, and /check?o=
  opens that observation's reproduce form.
  Your plan data stays.
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-lunation/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: MOONSTONE_URL
    services: [web]
    default: http://umbrel.local:8740
    note: Signer base URL for MCP. The default is the Moonstone app on this Umbrel.
  - name: MOONSTONE_RELAYS
    services: [web]
    default: ws://bitsperity-moonstone_relay_1:8080
    note: Comma-separated relay URLs for MCP. The default is the Moonstone app's relay.
  - name: MOONSTONE_BROWSER_PORT
    services: [web]
    default: "8740"
    note: Port of the Moonstone app on this Umbrel. The browser signs in through it on the same host you opened Lunation on (umbrel.local, the IP or a Tailscale name). Leave it empty to use MOONSTONE_BROWSER_RELAYS instead.
  - name: LUNATION_OWNERS
    services: [web]
    default: npub1r22hluhx79hymaa3g83lhd43d75lhuyh0pgt3v46vvv5vpsmtvusegap9v
    note: Owner keys, npub or hex, comma-separated. Owners always write and their statements count as human. Bots write once approved in Moonstone.
