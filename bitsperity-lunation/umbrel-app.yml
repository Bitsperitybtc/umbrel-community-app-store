manifestVersion: 1
id: bitsperity-lunation
category: developer
name: Lunation
version: "1.2.0"
tagline: Claims, decisions, work, evidence
description: >-
  Lunation keeps the reasoning behind a plan as a graph: claims, decisions,
  work and evidence, linked by signed, append-only events. It shows what needs a
  decision, what is stale, and which claims are supported. Agents work through six
  MCP tools; people sign with Moonstone or a NIP-07 extension.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/lunation
dependencies: []
repo: https://github.com/Bitsperitybtc/lunation
support: https://github.com/Bitsperitybtc/lunation/issues
port: 8748
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Lunation 1.2: an editable workspace on the signed log. Authors, the holder of a Work and
  owners can edit, archive and restore objects; edge authors and owners can remove edges.
  Every change is a signed history step, and archived objects leave lists, signals and search.
  Requirements form a tree (fulfilled only when every Work and open sub-requirement is done),
  Fleet signals "needs analysis", and claims, decisions and work carry paths. The UI and the six MCP tools
  are now in English: status, object, create, link, change, handover. This version starts with
  a fresh database (#152).
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-lunation/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: MOONSTONE_URL
    services: [web]
    default: http://umbrel.local:8740
    note: Signer base URL for MCP. The default is the Moonstone app on this Umbrel.
  - name: MOONSTONE_RELAYS
    services: [web]
    default: ws://bitsperity-moonstone_relay_1:8080
    note: Comma-separated relay URLs for MCP. The default is the Moonstone app's relay.
  - name: MOONSTONE_BROWSER_RELAYS
    services: [web]
    default: ws://umbrel.local:8741
    note: Comma-separated relay URLs the browser uses to pair with Moonstone. The default is the Moonstone app's published relay; use the same host you open Lunation on.
  - name: LUNATION_OWNERS
    services: [web]
    default: npub1r22hluhx79hymaa3g83lhd43d75lhuyh0pgt3v46vvv5vpsmtvusegap9v
    note: Owner keys, npub or hex, comma-separated. Owners always write and their statements count as human. Bots write once approved in Moonstone.
