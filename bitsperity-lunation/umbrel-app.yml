manifestVersion: 1
id: bitsperity-lunation
category: developer
name: Lunation
version: "2.0.0"
tagline: Plan with your agents, decide in one step
description: >-
  Lunation is where you and your agents plan, and where you decide. The reasoning
  behind a plan is a graph of problems, requirements, decisions, work and evidence,
  every change a signed, append-only event. Agents ask you questions with options,
  context and a recommendation; you answer in one step, and they see your answer and
  every change above their work. Three views: Decide, Map (walk the plan with the
  arrow keys) and Agents (add an agent in one flow). People sign in with Moonstone
  or a NIP-07 extension.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/lunation
dependencies: []
repo: https://github.com/Bitsperitybtc/lunation
support: https://github.com/Bitsperitybtc/lunation/issues
port: 8748
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Lunation 2.0. Sign-in with Moonstone works again behind the Umbrel gateway, with a
  one-click "Open in Moonstone"; please pair once more after the update. Agents can ask
  you questions with options and a recommendation, and see what changed above their work.
  New views: Decide, Map (cards you walk with the arrow keys, l links two objects) and
  Agents ("Add agent" sets up an agent with its own token in one flow). Changes appear
  live. New look: the bitsperity brand, parchment by day and warm ink by night. Needs
  Moonstone 0.3.4 or later. Your plan data stays; one new table is added.
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-lunation/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: MOONSTONE_URL
    services: [web]
    default: http://umbrel.local:8740
    note: Signer base URL for MCP. The default is the Moonstone app on this Umbrel.
  - name: MOONSTONE_RELAYS
    services: [web]
    default: ws://bitsperity-moonstone_relay_1:8080
    note: Comma-separated relay URLs for MCP. The default is the Moonstone app's relay.
  - name: MOONSTONE_BROWSER_PORT
    services: [web]
    default: "8740"
    note: Port of the Moonstone app on this Umbrel. The browser signs in through it on the same host you opened Lunation on (umbrel.local, the IP or a Tailscale name). Leave it empty to use MOONSTONE_BROWSER_RELAYS instead.
  - name: LUNATION_OWNERS
    services: [web]
    default: npub1r22hluhx79hymaa3g83lhd43d75lhuyh0pgt3v46vvv5vpsmtvusegap9v
    note: Owner keys, npub or hex, comma-separated. Owners always write and their statements count as human. Bots write once approved in Moonstone.
