version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-lunation_web_1
      APP_PORT: "8080"
      # No Umbrel login anywhere except /mcp-token, the MCP token for
      # Settings -> Agent-Zugang (MCP). Sign-in elsewhere is Nostr.
      PROXY_AUTH_WHITELIST: "*"
      PROXY_AUTH_BLACKLIST: "/mcp-token"

  web:
    # Multi-arch index digest (linux/amd64 + linux/arm64) of the v0.2.1 tag build.
    image: ghcr.io/bitsperitybtc/lunation:0.2.1@sha256:7ebd7e08c02eb3f24ab150dacca3bf95a28c5ad20aab24f366bd9de0c8429e18
    restart: on-failure
    stop_grace_period: 1m
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      LUNATION_DB: /data/lunation.sqlite
      LUNATION_BACKUP_DIR: /data/backups
      APP_SEED: ${APP_SEED}
      # Same-node Moonstone, as in Horizon: approval links and its mailbox relay
      # container. App Settings -> Environment can point both elsewhere.
      MOONSTONE_URL: http://${DEVICE_DOMAIN_NAME}:8740
      MOONSTONE_RELAYS: ws://bitsperity-moonstone_relay_1:8080
      LUNATION_ORIGINS: http://${DEVICE_DOMAIN_NAME}:8748,http://${DEVICE_HOSTNAME}:8748
      LUNATION_TRUSTED_PROXIES: 10.21.0.0/16
      # umbreld's app gateway connects from the app network gateway. /mcp-token
      # is answered only for that socket address, so the Umbrel login applies.
      LUNATION_PROXY_PEER: "10.21.0.1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
