version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-lunation_web_1
      APP_PORT: "8080"
      # No Umbrel login anywhere except /mcp-token, the MCP token for
      # Settings -> Agent access (MCP). Sign-in elsewhere is Nostr.
      PROXY_AUTH_WHITELIST: "*"
      PROXY_AUTH_BLACKLIST: "/mcp-token"

  web:
    # Multi-arch (linux/amd64 + linux/arm64) build of the lunation/v2.12.1 tag. Tag only here; the community-store copy adds the digest.
    # It never runs ahead of package.json.
    image: ghcr.io/bitsperitybtc/lunation:2.17.1@sha256:a2d219329bad88ae3b3d3ab432d9b6f19b9a6614ad666066945fbb72bf03fda4
    restart: on-failure
    stop_grace_period: 1m
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Umbrel Home > Backups > Lunation: outside the app data, so a reset or uninstall keeps the backups.
      - ${UMBREL_ROOT}/home/Backups/Lunation:/backups
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      # New file for the v1.1 model. The v0.2.x database stays where it is, untouched.
      LUNATION_DB: /data/lunation-v1.sqlite
      # The app backs up here every night at 03:00 (Europe/Berlin) and keeps 7 daily, 4 weekly, 12 monthly.
      LUNATION_BACKUP_DIR: /backups
      APP_SEED: ${APP_SEED}
      # Same-node Moonstone, as in Horizon: approval links and its mailbox relay
      # container. App Settings -> Environment can point both elsewhere.
      MOONSTONE_URL: http://${DEVICE_DOMAIN_NAME}:8740
      MOONSTONE_RELAYS: ws://bitsperity-moonstone_relay_1:8080
      # The browser reaches the same Moonstone on the host it loaded Lunation from: UI on this
      # port, mailbox at /mailbox on it (Moonstone 0.3.4 or later). So umbrel.local, the IP and a
      # Tailscale name all work; the container name above does not resolve in a browser.
      MOONSTONE_BROWSER_PORT: "8740"
      # Owner keys (npub or hex, comma-separated): they always write, and their statements count
      # as human. Bots write once approved in Moonstone. App Settings -> Environment can change it.
      LUNATION_OWNERS: npub1r22hluhx79hymaa3g83lhd43d75lhuyh0pgt3v46vvv5vpsmtvusegap9v
      # umbreld's app gateway connects from the app network gateway. /mcp-token
      # is answered only for that socket address, so the Umbrel login applies.
      LUNATION_PROXY_PEER: "10.21.0.1"
    healthcheck:
      # The image has no wget (bookworm-slim); node is always there.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
