version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-lunation_web_1
      APP_PORT: "8080"
      # No Umbrel login anywhere except /mcp-token, the MCP token for
      # Settings -> Agent-Zugang (MCP). Sign-in elsewhere is Nostr.
      PROXY_AUTH_WHITELIST: "*"
      PROXY_AUTH_BLACKLIST: "/mcp-token"

  web:
    # Multi-arch index digest (linux/amd64 + linux/arm64) of the lunation/v1.1.1 tag build.
    # It never runs ahead of package.json.
    image: ghcr.io/bitsperitybtc/lunation:1.1.1@sha256:84be1c74cf301742a8e832e78b03c5298a87e4a0ab5d3b50dbb7f5aebe7919ca
    restart: on-failure
    stop_grace_period: 1m
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      # New file for the v1.1 model. The v0.2.x database stays where it is, untouched.
      LUNATION_DB: /data/lunation-v1.sqlite
      LUNATION_BACKUP_DIR: /data/backups
      APP_SEED: ${APP_SEED}
      # Same-node Moonstone, as in Horizon: approval links and its mailbox relay
      # container. App Settings -> Environment can point both elsewhere.
      MOONSTONE_URL: http://${DEVICE_DOMAIN_NAME}:8740
      MOONSTONE_RELAYS: ws://bitsperity-moonstone_relay_1:8080
      # The same mailbox as a browser reaches it: Moonstone publishes its relay on port 8741.
      # The container name above does not resolve in a browser.
      MOONSTONE_BROWSER_RELAYS: ws://${DEVICE_DOMAIN_NAME}:8741
      # Owner keys (npub or hex, comma-separated): only they name keys, and their statements count
      # as human. Without an owner nobody can write. App Settings -> Environment can change it.
      LUNATION_OWNERS: npub1r22hluhx79hymaa3g83lhd43d75lhuyh0pgt3v46vvv5vpsmtvusegap9v
      LUNATION_ORIGINS: http://${DEVICE_DOMAIN_NAME}:8748,http://${DEVICE_HOSTNAME}:8748
      LUNATION_TRUSTED_PROXIES: 10.21.0.0/16
      # umbreld's app gateway connects from the app network gateway. /mcp-token
      # is answered only for that socket address, so the Umbrel login applies.
      LUNATION_PROXY_PEER: "10.21.0.1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
