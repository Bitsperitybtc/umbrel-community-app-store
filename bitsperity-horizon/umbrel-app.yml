manifestVersion: 1
id: bitsperity-horizon
category: finance
name: Horizon
version: "0.4.0"
tagline: Ideas and paid work on Nostr
description: >-
  bitsperity Horizon is a client-side market for ideas and paid work on
  Nostr. Ideas, jobs, offers, and contracts live on relays; Lightning
  settlement uses NWC in the browser. There is no Horizon backend and no
  Bitcoin node dependency.


  Browse ideas and jobs without an account. To publish, apply, or pay,
  connect a NIP-46 signer (for example bitsperity Moonstone) and, when money
  moves, a NWC wallet. Session and wallet data stay in the browser, not on
  the Umbrel disk.


  For agents, the app also runs the Horizon MCP at /mcp on the app port. It
  needs a bearer token, which Settings, Identity, Agent access (MCP) shows
  after the Umbrel login, and where you can also regenerate it. The MCP signs
  through Moonstone.
releaseNotes: >-
  Direct messages and offers now reach people who have no DM inbox list, and
  Horizon publishes your own inbox list at login when you have none. Jobs
  show one clear status, ratings can be given right after paying, and
  outdated Prompt Request suggestions are marked. Agents get a new
  list_offers tool; create_contract and confirm_contract take new inputs,
  so MCP clients built for 0.3 need updating.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/horizon
dependencies:
  - bitsperity-beacon
repo: https://github.com/Bitsperitybtc/horizon
support: https://github.com/Bitsperitybtc/horizon/issues
port: 3847
gallery:
  - https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-horizon/gallery/1.png
  - https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-horizon/gallery/2.png
  - https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-horizon/gallery/3.png
  - https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-horizon/gallery/4.png
path: ""
defaultUsername: ""
defaultPassword: ""
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-horizon/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: NOSTR_LOCAL_RELAYS
    services:
      - mcp
    default: ws://bitsperity-beacon_relay_1:7777
    note: "Relays the MCP reads and publishes on, comma-separated ws:// or wss:// URLs. The default is the bitsperity Beacon app."
  - name: HORIZON_PUBLIC_RELAYS
    services:
      - mcp
    note: "Relays the MCP names in poll and goal relay tags and in relay hints, comma-separated ws:// or wss:// URLs a browser can reach. Empty means this app's /relay, ws://<device>:3847/relay."
  - name: HORIZON_LOCAL_RELAY_UPSTREAM
    services:
      - web
    default: ws://bitsperity-beacon_relay_1:7777
    note: "Relay this app serves as /relay on its port, one ws://host:port[/path] URL. The default is the bitsperity Beacon app."
  - name: NOSTR_LOCAL_KEYS
    services:
      - mcp
    default: "1"
    options:
      - "0"
      - "1"
    note: "1 lets the MCP create local test identities (keys stored in this app's data). Testing only. 0 leaves signing to Moonstone."
  - name: HORIZON_TEST_RESET
    services:
      - mcp
    default: "1"
    options:
      - "0"
      - "1"
    note: "1 adds the MCP tool reset_test_data, which deletes the active local test identity's events on the relays above. Moonstone identities are refused. Testing only."
  - name: HORIZON_NWC_URI
    services:
      - mcp
    note: "Optional nostr+walletconnect:// URI for the MCP payment tools, for example a test wallet. Empty means no payment tools."
  - name: HORIZON_NWC_SIDE
    services:
      - mcp
    default: client
    options:
      - client
      - contractor
    note: "client can pay invoices, contractor can create them."
