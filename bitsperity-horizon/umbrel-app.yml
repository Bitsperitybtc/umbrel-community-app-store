manifestVersion: 1
id: bitsperity-horizon
category: finance
name: Horizon
version: "0.1.4"
tagline: Ideas and paid work on Nostr
description: >-
  bitsperity Horizon is a client-side market for ideas and paid work on
  Nostr. Ideas, jobs, offers, and contracts live on relays; Lightning
  settlement uses NWC in the browser. There is no Horizon backend and no
  Bitcoin node dependency.


  Browse ideas and jobs without an account. To publish, apply, or pay,
  connect a NIP-46 signer (for example bitsperity Moonstone) and, when money
  moves, a NWC wallet. Session and wallet data stay in the browser, not on
  the Umbrel disk.
releaseNotes: >-
  Comments, community threads, replies and jobs now work without a relay
  list (NIP-65): Horizon publishes them on the relays it reads from, and a
  comment or reply that is not published says why under the form. The
  Umbrel Nostr Relay app is reached through Horizon's own address at /relay,
  so reading and publishing also work when Horizon is open over https, such
  as in the Umbrel iOS app. Same-node sign-in needs Moonstone 0.3.4 or
  later.
