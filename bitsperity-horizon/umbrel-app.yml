manifestVersion: 1
id: bitsperity-horizon
category: finance
name: Horizon
version: "0.1.3"
tagline: Ideas and paid work on Nostr
description: >-
  bitsperity Horizon is a client-side market for ideas and paid work on
  Nostr. Ideas, jobs, offers, and contracts live on relays; Lightning
  settlement uses NWC in the browser. There is no Horizon backend and no
  Bitcoin node dependency.


  Browse ideas and jobs without an account. To publish, apply, or pay,
  connect a NIP-46 signer (for example bitsperity Moonstone) and, when money
  moves, a NWC wallet. Session and wallet data stay in the browser, not on
  the Umbrel disk.
releaseNotes: >-
  Sign in with Moonstone on the same Umbrel also works when Horizon is open
  over https, such as in the Umbrel iOS app: Nostr Connect now uses
  Moonstone's mailbox at wss://<host>:8740/mailbox (ws:// over http). This
  needs Moonstone 0.3.4 or later; with an older Moonstone the sign-in view
  says that the mailbox does not answer. A ws:// relay entered on an https
  page is refused with a clear message instead of hanging.
