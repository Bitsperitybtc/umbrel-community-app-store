# Umbrel package. Canonical copy: Bitsperitybtc/horizon umbrel/bitsperity-horizon/;
# Bitsperitybtc/umbrel-community-app-store carries an identical copy.
# Umbrel pulls the image by digest; the Docker workflow builds it from a `v*` tag.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-horizon_web_1
      APP_PORT: "80"
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/bitsperitybtc/horizon:0.1.1@sha256:332b19febfce99f9111ec62fd9613fdc9e5b225069919b47fc1ec5e945f16fa6
    restart: on-failure
    stop_grace_period: 1m
    init: true
    volumes:
      - ./signer-config.json:/usr/share/nginx/html/signer-config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
