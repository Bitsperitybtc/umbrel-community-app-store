manifestVersion: 1
id: bitsperity-moonstone
category: social
name: Moonstone
version: "0.4.2"
tagline: Hold Nostr keys on your node and sign for any NIP-46 client
description: >-
  bitsperity Moonstone holds your Nostr identities on this node and signs for
  any compliant NIP-46 client, including the other bitsperity apps. Keys are
  encrypted at rest (NIP-49). You approve, deny, and revoke each app per
  identity in this UI. Signing happens over a bundled mailbox relay — never
  over HTTP. Moonstone is never hosted publicly.


  Two ports: the UI on 8740 (behind Umbrel login) and the NIP-46 mailbox
  WebSocket on 8741 (no Umbrel cookie; NIP-46 is the access control). Pages
  opened over https reach the same mailbox at wss://<host>:8740/mailbox. Add a
  public wss:// relay in Settings to pair clients that are not on this node.
releaseNotes: >-
  Horizon, the Nostr MCP and other bitsperity apps now keep one client key
  per app and device, so signing in again or pairing again
  updates the existing approval instead of adding another row under Apps.
  An agent whose approval you revoked can be paired again once you approve
  the new pairing. Two pairings waiting at the same time no longer replace
  each other, and Activity shows repeated requests as one row with a count
  (×N). Your keys, identities and existing approvals are not changed.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/moonstone
dependencies: []
repo: https://github.com/Bitsperitybtc/moonstone
support: https://github.com/Bitsperitybtc/moonstone/issues
port: 8740
gallery:
  - https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-moonstone/gallery/1.png
  - https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-moonstone/gallery/2.png
path: ""
defaultUsername: ""
defaultPassword: ""
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-moonstone/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: MOONSTONE_ALLOWED_HOSTS
    services:
      - signer
    default: ""
    note: "Extra hostnames for the UI, comma-separated and exact, such as umbrel.tail1234.ts.net. IP addresses, umbrel and *.local work without this."
  - name: NOSTR_LOCAL_RELAYS
    services:
      - signer
    default: ws://bitsperity-beacon_relay_1:7777
    note: "Local relays the Nostr MCP may read and publish to, comma-separated ws:// or wss:// URLs. The default is the bitsperity Beacon app (ws://nostr-relay_relay_1:8080 for the Umbrel Nostr Relay app). Every other private host stays blocked."
  - name: LOG_LEVEL
    services:
      - signer
    default: info
    options:
      - error
      - info
      - debug
