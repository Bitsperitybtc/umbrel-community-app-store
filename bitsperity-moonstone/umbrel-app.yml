manifestVersion: 1
id: bitsperity-moonstone
category: social
name: bitsperity Moonstone
version: "0.1.0"
tagline: Hold Nostr keys on your node and sign for any NIP-46 client
description: >-
  bitsperity Moonstone holds your Nostr identities on this node and signs events for any
  compliant NIP-46 client (Amber, nsec.app, Alby, bitsperity Horizon, and others). Keys
  are encrypted at rest (NIP-49). You approve, deny, and revoke apps per
  identity in this UI. Signing happens over a bundled mailbox relay — never
  over HTTP.


  Two ports: the UI on 8740 (behind Umbrel login) and the NIP-46 mailbox
  WebSocket on 8741 (no Umbrel cookie; NIP-46 is the access control). Add a
  public wss:// relay in Settings to pair clients that are not on this node.
releaseNotes: >-
  First community listing as bitsperity Moonstone. NIP-46 remote signer:
  identities, per-identity unlock, one-click pairing, bundled kind-24133 mailbox.
