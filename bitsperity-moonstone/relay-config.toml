# Bundled NIP-46 mailbox. Not a general personal relay.
# Kind 24133 only; ephemeral (not archived across restart).

[info]
relay_url = "ws://127.0.0.1:8741/"
name = "bitsperity-moonstone-mailbox"
description = "NIP-46 mailbox for bitsperity Moonstone (kind 24133 only)."

[database]
# in_memory is only safe as long as exclusively ephemeral kinds (24133) are allowed;
# whoever allows further kinds must switch to a file-backed SQLite DB on tmpfs (see Kit #125).
in_memory = true

[network]
address = "0.0.0.0"
port = 8080

[options]
reject_future_seconds = 1800

[limits]
event_kind_allowlist = [24133]
