# Umbrel package. Canonical copy: Bitsperitybtc/moonstone bitsperity-moonstone/;
# Bitsperitybtc/umbrel-community-app-store carries an identical copy.
# Umbrel pulls the image by digest; ghcr.yml builds it from a `v*` tag.
#
# UI 8740 = app_proxy (Umbrel login). Mailbox 8741 = published WebSocket, no
# cookie (NIP-46 is the access control).
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-moonstone_signer_1
      APP_PORT: "8740"
      # Exact paths only. No wildcards, so nothing else under /mcp or /nostr-mcp is open.
      PROXY_AUTH_WHITELIST: "/mcp,/mcp/health,/nostr-mcp,/nostr-mcp/health"

  signer:
    image: ghcr.io/bitsperitybtc/moonstone:0.3.0@sha256:df81478d2852e3b54b65344191ec80ad99ea5d4b996be49c524fd64e8291c17b
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      APP_SEED: ${APP_SEED}
      # umbrelOS app-network gateway that the 2.0 app gateway proxies from
      MOONSTONE_PROXY_HOST: "10.21.0.1"
      LISTEN: 0.0.0.0:8740
      DEFAULT_SIGNER_DIAL: ws://relay:8080
      LOG_LEVEL: info
    depends_on:
      - relay
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8740/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  relay:
    # Pin the mailbox sidecar by digest. Kind 24133 only (see relay-config.toml).
    image: scsibug/nostr-rs-relay:latest@sha256:03f54bfbffff80a50db62c9287913bd25a2dec08033b56d2122bc2550363d5c5
    restart: on-failure
    ports:
      - "8741:8080"
    volumes:
      - ./relay-config.toml:/usr/src/app/config.toml:ro
