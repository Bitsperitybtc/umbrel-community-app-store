# Umbrel package. Canonical copy: Bitsperitybtc/moonstone bitsperity-moonstone/;
# Bitsperitybtc/umbrel-community-app-store carries an identical copy.
# Umbrel pulls the image by digest; ghcr.yml builds it from a `v*` tag.
#
# UI 8740 = app_proxy (Umbrel login). Mailbox 8741 = published WebSocket, no
# cookie (NIP-46 is the access control). The same relay is wss://<host>:8740/mailbox
# for https pages (Umbrel serves app ports over https; 8741 is plain ws).
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-moonstone_signer_1
      APP_PORT: "8740"
      # Exact paths only. No wildcards, so nothing else under /mcp or /nostr-mcp is open.
      # /mailbox is the WebSocket path to the bundled relay; like 8741 it has no cookie.
      PROXY_AUTH_WHITELIST: "/mcp,/mcp/health,/nostr-mcp,/nostr-mcp/health,/mailbox"

  signer:
    image: ghcr.io/bitsperitybtc/moonstone:0.3.10@sha256:0f7e251b83630c5ac84b72ac6d314df54fdfe6d7d23e27671fed0d4804592874
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      APP_SEED: ${APP_SEED}
      # umbrelOS app-network gateway that the 2.0 app gateway proxies from
      MOONSTONE_PROXY_HOST: "10.21.0.1"
      LISTEN: 0.0.0.0:8740
      # Container name: all Umbrel apps share umbrel_main_network, where `relay` can be another app.
      DEFAULT_SIGNER_DIAL: ws://bitsperity-moonstone_relay_1:8080
      # Local relays /nostr-mcp may open: the bitsperity Beacon app's relay container.
      NOSTR_LOCAL_RELAYS: ws://bitsperity-beacon_relay_1:7777
      LOG_LEVEL: info
    depends_on:
      - relay
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8740/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  relay:
    # NIP-46 mailbox: bitsperity Beacon (strfry), multi-arch, kind 24133 only.
    # Port 8080 inside, so DEFAULT_SIGNER_DIAL and stored dials stay valid.
    # The database is a tmpfs, so nothing survives a restart (24133 is ephemeral).
    # Digest: ghcr.io/bitsperitybtc/beacon:0.1.0 multi-arch index (amd64 + arm64).
    image: ghcr.io/bitsperitybtc/beacon:0.1.0@sha256:169feb1675be56c0becf41fdef11aa08737361e6cf25d54d41e17c2e514d6ca6
    restart: on-failure
    ports:
      - "8741:8080"
    tmpfs:
      - /app/strfry-db
    environment:
      RELAY_WRITE_KINDS: "24133"
    command:
      - --set
      - relay.port=8080
      - --set
      - relay.info.name=bitsperity-moonstone-mailbox
      - --set
      - relay.info.description=NIP-46 mailbox for bitsperity Moonstone (kind 24133 only).
      - --set
      - events.rejectEventsNewerThanSeconds=1800
      - relay
