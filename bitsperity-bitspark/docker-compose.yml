version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-bitspark_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    # Replace tag and pin digest when the multi-arch image is published.
    # Official umbrel-apps PRs require: registry/repo:version@sha256:<digest>
    image: ghcr.io/bitsperitybtc/bitspark:0.0.1
    restart: on-failure
    stop_grace_period: 1m
    init: true
