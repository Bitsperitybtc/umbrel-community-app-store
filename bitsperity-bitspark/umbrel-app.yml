manifestVersion: 1
id: bitsperity-bitspark
category: bitcoin
name: BitSpark
version: "sha-b2437ef.2"
tagline: Idea Engine on Nostr
description: >-
  BitSpark is a client-side Idea Engine on Nostr. Shape ideas, post paid jobs,
  and settle with Lightning — no central platform in the middle.


  Sign in with a Nostr signer (NIP-46). Lightning payments use Wallet Connect
  (NWC) from Settings. Identity and wallet stay in your browser; events live on
  relays.


  Browse ideas and jobs without an account. Publishing, applying, tipping, and
  settlement need a signer and, when money moves, a connected wallet.
releaseNotes: >-
  App icon is the same BitsparkMark as in the app, scaled to fill the Umbrel
  tile. Container is still main sha-b2437ef.
