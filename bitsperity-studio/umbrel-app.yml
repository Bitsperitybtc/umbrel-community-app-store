manifestVersion: 1
id: bitsperity-studio
category: developer
name: Forester
version: "3.8.4"
tagline: See what a Canopy forest is doing
description: >-
  Forester is the window onto a Canopy forest. It shows what each agent is doing,
  what happened, what a call cost, and what is waiting for a person. It keeps no
  copy of the forest: every value comes from that forest's observe API.


  Point it at a forest in App Settings. Observe and control URLs are how this
  container reaches the forest, not how a browser does; the forest names itself.
  The control token is the forest's CANOPY_CONTROL_TOKEN. Until those match, Forester opens and the forest
  shows as unreachable; control stays refused.


  The page is behind the Umbrel login. Agents use /mcp on this port, each with its
  own token: under Agents, add an agent (approve it in Moonstone), copy its MCP
  configuration once, and tick per forest whether it may read and hand tasks.
  Every call an agent makes is listed there. Removing an agent stops its token.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/bitsperity
dependencies: []
repo: https://github.com/Bitsperitybtc/bitsperity
support: https://github.com/Bitsperitybtc/bitsperity/issues
port: 8750
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Forester 3.8.4. The MCP overview counts every call of the day instead of the newest thousand and, for one
  agent, shows only that agent's instances. Now says what an agent between calls is doing and since when each
  one is in its state. Cost rows match the grouping asked for and add up to the total, and calls without a
  known price are marked on every row. Detailed event lists read like the short ones, and cancelling a call
  the forest does not have says so. Every tool says that an agent is one of the forest's, not the caller.
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/23f309215c92891a1a6b9102109992e0f4bc1250/bitsperity-studio/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: STUDIO_OBSERVE_URL
    services: [web]
    default: http://127.0.0.1:8787
    note: "Observe API of the forest, as this container dials it, for example http://bitsperity-spero_observe_1:8787. The default is this container itself, so the forest shows as unreachable until you change it."
  - name: STUDIO_CONTROL_URL
    services: [web]
    default: http://127.0.0.1:8788
    note: "Control API of the forest, as this container dials it, for example http://bitsperity-spero_runner_1:8788."
  - name: CANOPY_CONTROL_TOKEN
    services: [web]
    default: change-me
    note: "The forest's control token. Reads work without it. Control (pause, cancel, approve) is refused until this matches the forest."
