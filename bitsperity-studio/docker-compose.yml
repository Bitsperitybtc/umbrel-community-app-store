# Umbrel package. Canonical copy: Bitsperitybtc/bitsperity apps/forester/umbrel/bitsperity-studio/;
# Bitsperitybtc/umbrel-community-app-store carries an identical copy, plus icon.png.
# Tag only here; the community-store copy adds the digest. The release workflow builds the image from a forester/v* tag.
# The app id stays bitsperity-studio from before the rename to Forester, so an installed app updates in place.
#
# Port 8750 (app gateway -> Forester on 3000) is the read-only window onto one Canopy forest.
# The UI (with Agents, where the owner adds agents and grants them forests) is behind the
# Umbrel login. /mcp is not: it answers only an added agent's own token.
# ${APP_DATA_DIR}/data (mode 700, hooks/pre-start) holds Forester's agents, their token digests,
# its Moonstone client key and the access log.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-studio_web_1
      APP_PORT: "3000"
      PROXY_AUTH_WHITELIST: "/mcp,/mcp/health"

  web:
    # Multi-arch (linux/amd64 + linux/arm64). Tag only here; the community-store copy adds the digest.
    image: ghcr.io/bitsperitybtc/forester:3.8.2@sha256:378be17da5d3bad724f4ec1e0586970d32dcd6e54204f2ed72c0f6220a96ce11
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      # The control proxy allows a POST only when Origin equals this page's origin.
      # Behind the app gateway those come from the forwarded host and scheme.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # 127.0.0.1 is this container, so the default forest stays unreachable until
      # App Settings names the observe and control URLs Forester can dial.
      STUDIO_OBSERVE_URL: http://127.0.0.1:8787
      STUDIO_CONTROL_URL: http://127.0.0.1:8788
      CANOPY_CONTROL_TOKEN: change-me
      # Agents -> Add agent pairs an agent through the same-node Moonstone, as in Notus: its approval
      # links (the page moves them to this page's host on port 8740) and its mailbox relay container.
      MOONSTONE_URL: http://${DEVICE_DOMAIN_NAME}:8740
      MOONSTONE_RELAYS: ws://bitsperity-moonstone_relay_1:8080
      # Nostr names and pictures of agents and identities (read only): the owner's on the node's
      # Beacon, the agents' on relay.annotome.com. Set but empty turns profile reads off.
      FORESTER_PROFILE_RELAYS: ws://bitsperity-beacon_relay_1:7777,wss://relay.annotome.com
      FORESTER_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # Writes the forest list from the environment, then serves; the forest names itself (name: in its canopy.yaml).
    # The list is not a mounted file: an update only copies this compose file, so the writer has to live here.
    command:
      - sh
      - -c
      - |
        set -eu
        observe="$$STUDIO_OBSERVE_URL"
        control="$$STUDIO_CONTROL_URL"
        token="$$CANOPY_CONTROL_TOKEN"
        printf '%s\n' "$$observe" | grep -Eq '^https?://[^[:space:]'\''"]+$$'
        printf '%s\n' "$$control" | grep -Eq '^https?://[^[:space:]'\''"]+$$'
        test -n "$$token"
        printf 'forests:\n  - observeUrl: %s\n    controlUrl: %s\n    controlToken: CANOPY_CONTROL_TOKEN\n' "$$observe" "$$control" > /tmp/forests.yaml
        export CANOPY_STUDIO_FORESTS=/tmp/forests.yaml
        exec node build
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
