manifestVersion: 1
id: bitsperity-spero
category: finance
name: Spero
version: "1.4.1"
tagline: Research forest on Canopy
description: >-
  Spero is a paper-and-research trading forest on the Canopy runtime. It
  places no orders. It reads Notus at http://bitsperity-notus_web_1:8096.


  The keys are App Settings: the Notus internal key, the token the model driver
  asks for, and the control token Forester uses. Until they are set the runner
  stops and says which one is missing.


  The vault is the folder of the Notus app: Spero writes it, Notus shows it.
  Steer is on: the forest changes its own universe, watch queue and sync slots.
  The wire sends its lines to the owners as Nostr direct messages, signed by the
  Moonstone app; pair the identities once in Forester (Identities). The vault push
  is off in this package. Forester is its own app.
releaseNotes: >-
  Spero 1.4.1 runs on Canopy 3.8.1 and names itself Spero, so Forester shows it as Spero at /f/spero. When
  Notus refuses a thesis, the failed call now says why, and a reply that does not fit its schema names the field.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/bitsperity
dependencies:
  - bitsperity-notus
repo: https://github.com/Bitsperitybtc/bitsperity
support: https://github.com/Bitsperitybtc/bitsperity/issues
# Observe UI. Check the host port is free on the Umbrel before install.
port: 8787
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-spero/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
environment:
  - name: NOTUS_INTERNAL_API_KEY
    services: [runner]
    note: "The internal API key of Notus on this Umbrel. Spero sends it with every read."
  - name: CLAUDE_CODE_OAUTH_TOKEN
    services: [runner]
    note: "The credential of the model driver that canopy.yaml names."
  - name: CANOPY_CONTROL_TOKEN
    services: [runner]
    note: "Token of the control API. Choose one and give Forester the same value; without it the runner does not start."
