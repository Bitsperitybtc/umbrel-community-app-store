# Umbrel package for Spero (community app id `bitsperity-spero`).
# Canonical copy: Bitsperitybtc/bitsperity apps/spero/umbrel/bitsperity-spero/. The community store
# (Bitsperitybtc/umbrel-community-app-store) carries an identical copy in bitsperity-spero/.
#
# The package brings everything: the image holds the Canopy runtime and this forest as /policy, the
# keys are App Settings (umbrel-app.yml `environment`), and hooks/pre-start makes the data folders.
# Nothing is copied onto the Umbrel by hand. Until the keys are set the runner stops with
# `env.missing` and Docker starts it again.
#
# Bridge, not host: umbreld puts every service on umbrel_main_network. Containers are
# <app id>_<service>_1: bitsperity-spero_runner_1, bitsperity-spero_observe_1. Notus is
# http://bitsperity-notus_web_1:8096.
# Studio is its own app (bitsperity-studio): it reads http://bitsperity-spero_observe_1:8787 and controls
# http://bitsperity-spero_runner_1:8788 with the same CANOPY_CONTROL_TOKEN.
# The vault is the folder of the Notus app (data/vault), so what Spero writes shows in Notus at once.
# Steer, notify and vault push are off. Nostr is off: MOONSTONE_URL is unset.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-spero_observe_1
      APP_PORT: "8787"

  runner:
    # Multi-arch index digest (linux/amd64 + linux/arm64) of spero:v1.0.4, which runs on canopy:v3.0.2.
    image: ghcr.io/bitsperitybtc/spero:v1.0.4@sha256:0d6a6cdebcc04d7975c13560dde7efffbd95d3b76e036e208a655cd8129e3d04
    restart: unless-stopped
    stop_grace_period: 1m
    init: true
    environment:
      NOTUS_URL: http://bitsperity-notus_web_1:8096
      # Studio dials the control port from its own container; serve refuses this bind without CANOPY_CONTROL_TOKEN.
      CANOPY_CONTROL_HOST: 0.0.0.0
      # Nostr off: without Moonstone no identity can sign, and the forest runs without them.
      MOONSTONE_URL: ""
      VAULT_DIR: /vault
      VAULT_GIT_PUSH: "0"
      # Named because the forest's env list is closed; neither is read while the push is off.
      VAULT_GIT_BRANCH: main
      VAULT_GIT_SSH_KEY: /state/vault-deploy-key
      CASH_STATE_DIR: /state
      CASH_WORK_DIR: /work
      CASH_LIVE_KINDS: hunt,depth
      CASH_STEER_LIVE: "0"
      CASH_NOTIFY_SEND: "0"
      CASH_HUNT_MAX_RUNS: "5"
      CASH_HYGIENE_MAX_RUNS: "5"
    volumes:
      - ${APP_DATA_DIR}/data/workspaces:/work
      - ${APP_DATA_DIR}/data/logs:/state
      # One vault on the Umbrel: the folder Notus reads and shows. Spero writes it; Notus only indexes it.
      - ${APP_DATA_DIR}/../bitsperity-notus/data/vault:/vault
      - ${APP_DATA_DIR}/../bitsperity-notus/data/vault:/work/cash/vault:ro
    # Image HEALTHCHECK stays on: it polls the serve control port on this container's loopback.
    mem_limit: 4g

  observe:
    image: ghcr.io/bitsperitybtc/spero:v1.0.4@sha256:0d6a6cdebcc04d7975c13560dde7efffbd95d3b76e036e208a655cd8129e3d04
    restart: unless-stopped
    init: true
    # observe-http binds loopback by default; app_proxy needs 0.0.0.0.
    command: ["canopy", "observe-http", "--policy", "/policy", "--state", "/state", "--host", "0.0.0.0", "--port", "8787"]
    environment:
      CANOPY_FOREST: /policy
    volumes:
      # Not :ro: observe opens events.sqlite (WAL) and gets "attempt to write a readonly database" on a ro mount.
      - ${APP_DATA_DIR}/data/logs:/state
    # The image HEALTHCHECK targets the runner port 8788, which observe does not serve.
    healthcheck:
      disable: true
    mem_limit: 512m
