version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-beacon_relay_1
      APP_PORT: "7777"
      # Nostr clients cannot do the Umbrel login; the relay gates writes itself.
      PROXY_AUTH_ADD: "false"

  relay:
    # Multi-arch index digest (linux/amd64 + linux/arm64) of the v0.2.0 tag build.
    image: ghcr.io/bitsperitybtc/beacon:0.2.0@sha256:7e0dc59b28305a17aa8ae8ba23f7aa39bdbc96c115d0477dea7ec4d42bc53c58
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    init: true
    # NIP-11 info document from the relay port, with the busybox wget and the
    # jq that are in the image (no curl). CI runs this exact command.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O - --header 'Accept: application/nostr+json' http://127.0.0.1:7777/ | jq -e .supported_nips >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/app/strfry-db
    environment:
      RELAY_WRITE_PUBKEYS: ""
