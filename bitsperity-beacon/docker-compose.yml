version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-beacon_relay_1
      APP_PORT: "7777"
      # Nostr clients cannot do the Umbrel login; the relay gates writes itself.
      PROXY_AUTH_ADD: "false"

  relay:
    # Multi-arch (linux/amd64 + linux/arm64). Tag only here; the community-store copy adds the digest.
    image: ghcr.io/bitsperitybtc/beacon:0.4.6@sha256:3284fd8717b4d5694377d5319ea328390cb9ad87e74201b4571da9b226768279
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    init: true
    # NIP-11 info document from the relay port, with the busybox wget and the
    # jq that are in the image (no curl). CI runs this exact command.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O - --header 'Accept: application/nostr+json' http://127.0.0.1:7777/ | jq -e .supported_nips >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/app/strfry-db
    environment:
      RELAY_WRITE_PUBKEYS: ""
      # The browser app on the same port. Unset (Moonstone's mailbox) means relay only.
      BEACON_UI: "on"
