manifestVersion: 1
id: bitsperity-notus
category: finance
name: Notus
version: "3.1.6"
tagline: Financial news intelligence for Spero
description: >-
  Notus collects market news, prices and fundamentals into Postgres, scores
  thesis relations with local d1 and EmbeddingGemma-2 models, and serves the
  result over HTTP to Spero. Runs on amd64 only.


  Other apps on this Umbrel reach the API at http://bitsperity-notus_web_1:8096.
  Secrets live in ${APP_DATA_DIR}/notus.env (mode 600), never in this package.
  The paper writer is off until the compose sets it on.
releaseNotes: >-
  Notus no longer depends on EODHD for calendar and fundamentals: earnings come
  from Finnhub, fundamentals from SEC filings with the Finnhub company profile
  as fallback. The chart shows live US prices on demand while it is open.
  Acceptance fixes across the stock page, charts, cockpit and scanner (dates,
  freshness badges, empty states). Coverage is US only: non-US symbols show
  "Not covered (US only)" and are no longer synced. No database migration.
developer: Bitsperity
website: https://github.com/Bitsperitybtc/notus
dependencies: []
repo: https://github.com/Bitsperitybtc/notus
support: https://github.com/Bitsperitybtc/notus/issues
# Not 8096: that host port belongs to Jellyfin on Umbrel. Inside the Umbrel network
# the web container still listens on 8096 (bitsperity-notus_web_1:8096).
port: 8796
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
icon: https://raw.githubusercontent.com/Bitsperitybtc/umbrel-community-app-store/master/bitsperity-notus/icon.png
submitter: Bitsperity
submission: https://github.com/Bitsperitybtc/umbrel-community-app-store
