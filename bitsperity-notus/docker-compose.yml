# Umbrel package for Notus (app id `bitsperity-notus`, store prefix `bitsperity-` as in Bitsperitybtc/umbrel-community-app-store). Canonical copy: Bitsperitybtc/notus umbrel/bitsperity-notus/.
# Runbook (install, in-app restore of the laptop dump, migrations, rollback):
#   docs/operations/umbrel-cutover.md
#
# Networking: bridge, not host. All containers sit on umbrel_main_network, so other apps
# (Spero) reach Notus as http://bitsperity-notus_web_1:8096. Inside this app, services address each
# other by container name too (bitsperity-notus_postgres_1, bitsperity-notus_relation-d1_1, ...): bare service
# names like `postgres` are shared by every app on that network.
#
# Secrets: ${APP_DATA_DIR}/notus.env (mode 600, filled by scp from the laptop .env).
# ${APP_DATA_DIR}/db.env holds the generated Postgres password and DATABASE_URL.
# hooks/pre-start creates both on first start and keeps them at 600.
services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-notus_web_1
      APP_PORT: "8096"

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - ${APP_DATA_DIR}/db.env
    environment:
      POSTGRES_DB: notus
      POSTGRES_USER: notus
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-boot initdb the temporary server listens on the
      # socket only, and restore connects over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notus -d notus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot on every start: restores restore/notus.dump into an EMPTY database (sha256-checked,
  # one transaction, no DROP/--clean), logs row counts, and opens the gate data/restore-state/done
  # for web. Empty DB without dump: exits 0 with the gate closed, so install does not fail and
  # web never starts against an empty DB. Details: hooks/restore.sh, docs/operations/umbrel-cutover.md.
  restore:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    entrypoint: ["sh", "/restore.sh"]
    env_file:
      - ${APP_DATA_DIR}/db.env
    volumes:
      - ${APP_DATA_DIR}/restore:/restore:ro
      - ${APP_DATA_DIR}/data/restore-state:/state
      - ${APP_DATA_DIR}/hooks/restore.sh:/restore.sh:ro
      - ${APP_DATA_DIR}/hooks/row-counts.sql:/row-counts.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    # Tag from .github/workflows/release.yml. Pin @sha256 from the release run summary before install.
    image: ghcr.io/bitsperitybtc/notus:v3.1.4@sha256:e2f6953ff4191241766538ca05e1d1c366a4b068085494c11dd2d0cde390fe93
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    # Later files win: db.env's DATABASE_URL beats any DATABASE_URL in the laptop .env.
    env_file:
      - ${APP_DATA_DIR}/notus.env
      - ${APP_DATA_DIR}/db.env
    # `environment` beats both env files.
    environment:
      PORT: "8096"
      HOST: 0.0.0.0
      TZ: UTC
      # On since Sascha's go at the 2026-10-28 cutover; the laptop writer is stopped.
      # Paper only: paperHost.ts refuses any host but paper-api.alpaca.markets.
      # This line wins over notus.env. Rollback = "off" in a PR and update the app.
      NOTUS_PAPER_WRITER: "on"
      # No Notus login on Umbrel: the Umbrel app_proxy already guards the UI (Sascha, 2026-10-30).
      # Wins over notus.env. /api/v1 stays behind NOTUS_INTERNAL_API_KEY.
      NOTUS_UI_BASIC_AUTH_ENABLED: "false"
      RELATION_D1_URL: http://bitsperity-notus_relation-d1_1:8080
      RELATION_EMBED_URL: http://bitsperity-notus_relation-embed_1:8080
      NOTUS_VAULT_DIR: /data/vault
      NOTUS_VAULT_DEPLOY_KEY_FILE: /run/secrets/notus-vault-deploy-key
    # Gate: wait until restore opened data/restore-state/done, then apply pending migrations
    # (0060+), then serve. A failed migration exits; nothing is served against a half schema.
    command: ["sh", "-c", "until [ -s /restore-state/done ]; do echo '[web] waiting for restore gate (see restore logs)'; sleep 30; done; node scripts/migrate.mjs && exec node build"]
    tmpfs:
      - /tmp:size=16m
    volumes:
      # Own read-only spero-vault clone (vault-mount-contract.md). The process clones and fetches it.
      - ${APP_DATA_DIR}/data/vault:/data/vault
      - ${APP_DATA_DIR}/secrets/spero-vault-deploy:/run/secrets/notus-vault-deploy-key:ro
      - ${APP_DATA_DIR}/data/restore-state:/restore-state:ro
    depends_on:
      postgres:
        condition: service_healthy
      restore:
        condition: service_completed_successfully

  # One-shot: pinned GGUFs into data/models, SHA256-checked, no token. Same script as
  # scripts/relation/fetch-models.sh (CI checks they are identical).
  relation-models:
    image: ghcr.io/ggml-org/llama.cpp:server-b11946@sha256:d880b2a0e478795ce99d0a275732f5a50e579cb234ae7d2d3815afc909fd02f2
    entrypoint: ["sh", "/fetch-models.sh"]
    environment:
      MODEL_DIR: /models
    volumes:
      - ${APP_DATA_DIR}/data/models:/models
      - ${APP_DATA_DIR}/hooks/fetch-models.sh:/fetch-models.sh:ro
    restart: "no"

  # Sizing as docker-compose.relation.yml (#21): N100, 4 threads, 1 slot, ctx/batch 1024.
  relation-d1:
    image: ghcr.io/ggml-org/llama.cpp:server-b11946@sha256:d880b2a0e478795ce99d0a275732f5a50e579cb234ae7d2d3815afc909fd02f2
    command: ["-m", "/models/d1-2B-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "--threads", "4", "--parallel", "1", "--ctx-size", "1024", "--batch-size", "1024", "--ubatch-size", "1024", "--no-repack"]
    env_file:
      - ${APP_DATA_DIR}/relation.env
    volumes:
      - ${APP_DATA_DIR}/data/models:/models:ro
    mem_limit: 1600m
    depends_on:
      relation-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  relation-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-b11946@sha256:d880b2a0e478795ce99d0a275732f5a50e579cb234ae7d2d3815afc909fd02f2
    command: ["-m", "/models/embeddinggemma-2-Q8_0.gguf", "--embeddings", "--host", "0.0.0.0", "--port", "8080", "--threads", "4", "--parallel", "1", "--ctx-size", "1024", "--batch-size", "1024", "--ubatch-size", "1024", "--no-repack"]
    env_file:
      - ${APP_DATA_DIR}/relation.env
    volumes:
      - ${APP_DATA_DIR}/data/models:/models:ro
    mem_limit: 640m
    depends_on:
      relation-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
