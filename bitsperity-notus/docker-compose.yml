# Umbrel package for Notus (app id `bitsperity-notus`, store prefix `bitsperity-` as in Bitsperitybtc/umbrel-community-app-store). Canonical copy: Bitsperitybtc/notus umbrel/bitsperity-notus/.
# Runbook (install, in-app restore of the laptop dump, migrations, rollback):
#   docs/operations/umbrel-cutover.md
#
# Networking: bridge, not host. All containers sit on umbrel_main_network, so other apps
# (Spero) reach Notus as http://bitsperity-notus_web_1:8096. Inside this app, services address each
# other by container name too (bitsperity-notus_postgres_1, ...): bare service
# names like `postgres` are shared by every app on that network.
#
# Secrets: ${APP_DATA_DIR}/notus.env (mode 600, filled by scp from the laptop .env).
# ${APP_DATA_DIR}/db.env holds the generated Postgres password and DATABASE_URL.
# hooks/pre-start creates both on first start and keeps them at 600.
services:
  app_proxy:
    environment:
      APP_HOST: bitsperity-notus_web_1
      APP_PORT: "8096"
      # No Umbrel login: the owner signs in to Notus with Moonstone (NOTUS_OWNERS below), as in
      # Lunation and Horizon. One login only.
      PROXY_AUTH_WHITELIST: "*"

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - ${APP_DATA_DIR}/db.env
    environment:
      POSTGRES_DB: notus
      POSTGRES_USER: notus
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-boot initdb the temporary server listens on the
      # socket only, and restore connects over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notus -d notus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot on every start: restores restore/notus.dump into an EMPTY database (sha256-checked,
  # one transaction, no DROP/--clean), logs row counts, and opens the gate data/restore-state/done
  # for web. Empty DB without dump: exits 0 with the gate closed, so install does not fail and
  # web never starts against an empty DB. Details: hooks/restore.sh, docs/operations/umbrel-cutover.md.
  restore:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    entrypoint: ["sh", "/restore.sh"]
    env_file:
      - ${APP_DATA_DIR}/db.env
    volumes:
      - ${APP_DATA_DIR}/restore:/restore:ro
      - ${APP_DATA_DIR}/data/restore-state:/state
      - ${APP_DATA_DIR}/hooks/restore.sh:/restore.sh:ro
      - ${APP_DATA_DIR}/hooks/row-counts.sql:/row-counts.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    # Tag from .github/workflows/release.yml. Tag only here; the community-store copy adds the digest.
    image: ghcr.io/bitsperitybtc/notus:3.5.2@sha256:ddfdab12e22482650f5d4eeb8d0d8154d6d464a691230667704990c6a2f02c8a
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    # Later files win: db.env's DATABASE_URL beats any DATABASE_URL in the laptop .env.
    env_file:
      - ${APP_DATA_DIR}/notus.env
      - ${APP_DATA_DIR}/db.env
    # `environment` beats both env files.
    environment:
      PORT: "8096"
      HOST: 0.0.0.0
      TZ: UTC
      # On since Sascha's go at the 2026-10-28 cutover; the laptop writer is stopped.
      # Paper only: paperHost.ts refuses any host but paper-api.alpaca.markets.
      # This line wins over notus.env. Rollback = "off" in a PR and update the app.
      NOTUS_PAPER_WRITER: "on"
      # No Basic Auth on Umbrel: the owner's Moonstone sign-in guards the screens and /api/ui.
      # Wins over notus.env. /api/v1 stays behind NOTUS_INTERNAL_API_KEY and signed writes.
      NOTUS_UI_BASIC_AUTH_ENABLED: "false"
      # The owner (rafiki71): only this key gets a session on the screens, and it holds every grant
      # for signed writes. A public key, not a secret. App Settings -> Environment can change it.
      NOTUS_OWNERS: npub1r22hluhx79hymaa3g83lhd43d75lhuyh0pgt3v46vvv5vpsmtvusegap9v
      # The sign-in reaches the same-node Moonstone on the host Notus was loaded from: its pairing
      # page on this port and its mailbox at /mailbox on it, as in Lunation.
      MOONSTONE_BROWSER_PORT: "8740"
      # System -> Agents -> Add agent: the server pairs an agent through the same-node Moonstone, as
      # in Lunation: its approval links (the page moves them to the port above) and its mailbox relay
      # container. Notus keeps only the approved pubkey. App Settings -> Environment can change both.
      MOONSTONE_URL: http://${DEVICE_DOMAIN_NAME}:8740
      MOONSTONE_RELAYS: ws://bitsperity-moonstone_relay_1:8080
      # The screens and /api/ui answer only umbreld's app gateway (the network's default gateway), so
      # another app on the Umbrel cannot use them past the Umbrel login. Agents keep /api/v1.
      NOTUS_UI_GATEWAY_ONLY: "true"
      # Reads keep the shared key (NOTUS_INTERNAL_API_KEY in notus.env); writes are signed by identities.
      NOTUS_ENFORCE_INTERNAL_API_KEY: "true"
      # d1 and EmbeddingGemma-2 run in Ollama on Sascha's laptop (RTX 4070), the same Ollama Lunation
      # uses. While the laptop is off, the relation job stops with "d1 unreachable" and the pairs stay
      # open for the 14-day lookback; it carries on by itself once the laptop is back.
      RELATION_D1_URL: http://192.168.178.67:11434
      RELATION_EMBED_URL: http://192.168.178.67:11434
      # d1 with a batch of 1024 (scripts/relation/ollama/notus-d1.Modelfile); Ollama's 512 refuses long news.
      RELATION_D1_MODEL: notus-d1
      NOTUS_VAULT_DIR: /data/vault
      NOTUS_VAULT_DEPLOY_KEY_FILE: /run/secrets/notus-vault-deploy-key
    # Gate: wait until restore opened data/restore-state/done, then apply pending migrations
    # (0060+), then serve. A failed migration exits; nothing is served against a half schema.
    command: ["sh", "-c", "until [ -s /restore-state/done ]; do echo '[web] waiting for restore gate (see restore logs)'; sleep 30; done; node scripts/migrate.mjs && exec node build"]
    tmpfs:
      - /tmp:size=16m
    volumes:
      # Own read-only spero-vault clone (vault-mount-contract.md). The process clones and fetches it.
      - ${APP_DATA_DIR}/data/vault:/data/vault
      - ${APP_DATA_DIR}/secrets/spero-vault-deploy:/run/secrets/notus-vault-deploy-key:ro
      - ${APP_DATA_DIR}/data/restore-state:/restore-state:ro
    depends_on:
      postgres:
        condition: service_healthy
      restore:
        condition: service_completed_successfully
